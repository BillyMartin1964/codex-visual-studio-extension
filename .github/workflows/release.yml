name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão já gravada no código, no formato major.minor.patch"
        required: true
        type: string
      prerelease:
        description: "Publicar como pré-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      VSIX_SIGNING_PFX_BASE64: ${{ secrets.VSIX_SIGNING_PFX_BASE64 }}
      VSIX_SIGNING_PFX_PASSWORD: ${{ secrets.VSIX_SIGNING_PFX_PASSWORD }}
      VSIX_SIGNING_CERT_SHA256: ${{ secrets.VSIX_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Resolve and validate source version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw -Encoding UTF8
          $sourceVersion = [string]$props.Project.PropertyGroup.Version

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requestedVersion = "${{ inputs.version }}"
            $prerelease = "${{ inputs.prerelease }}"
          }
          else {
            $requestedVersion = "${{ github.ref_name }}".TrimStart("v")
            $prerelease = "false"
          }

          if ($sourceVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Directory.Build.props contém uma versão inválida: '$sourceVersion'."
          }
          if ($requestedVersion -ne $sourceVersion) {
            throw "A versão solicitada '$requestedVersion' difere da versão commitada '$sourceVersion'. Execute scripts/Set-VsixVersion.ps1, revise e faça commit antes do release."
          }

          [xml]$manifest = Get-Content CodexVsix\source.extension.vsixmanifest -Raw -Encoding UTF8
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("vsix", "http://schemas.microsoft.com/developer/vsx-schema/2011")
          $identity = $manifest.SelectSingleNode("/vsix:PackageManifest/vsix:Metadata/vsix:Identity", $ns)
          if (-not $identity -or [string]$identity.Version -ne $sourceVersion) {
            throw "source.extension.vsixmanifest não está sincronizado com Directory.Build.props."
          }

          @(
            "version=$sourceVersion"
            "tag=v$sourceVersion"
            "prerelease=$prerelease"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore locked dependencies and audit
        shell: pwsh
        run: |
          dotnet restore CodexVs2026Extension.sln `
            --locked-mode `
            -p:NuGetAudit=true `
            -p:NuGetAuditMode=all `
            -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Test
        shell: pwsh
        run: dotnet test CodexVs2026Extension.sln -c Release --no-restore

      - name: Test frozen WebView compatibility
        run: node --test scripts/tests/webview-compatibility.test.mjs

      - name: Build VSIX
        shell: pwsh
        run: |
          Remove-Item -LiteralPath CodexVsix\CodexVsix.vsix -ErrorAction SilentlyContinue
          msbuild CodexVsix\CodexVsix.csproj `
            /t:Rebuild `
            /m `
            /p:Configuration=Release `
            /p:RestoreLockedMode=true `
            /p:BuildVsixPackage=true `
            /p:Version=${{ steps.version.outputs.version }}

      - name: Verify unsigned build output
        shell: pwsh
        run: |
          .\scripts\Test-VsixPackage.ps1 `
            -VsixPath CodexVsix\CodexVsix.vsix `
            -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Sign VSIX when signing credentials are configured
        if: ${{ env.VSIX_SIGNING_PFX_BASE64 != '' && env.VSIX_SIGNING_PFX_PASSWORD != '' && env.VSIX_SIGNING_CERT_SHA256 != '' }}
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP "sign-cli"
          $certificatePath = Join-Path $env:RUNNER_TEMP "vsix-signing.pfx"
          try {
            dotnet tool install sign `
              --tool-path $toolPath `
              --version 0.9.1-beta.26330.1
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:VSIX_SIGNING_PFX_BASE64))

            & (Join-Path $toolPath "sign.exe") code certificate-store `
              -cf $certificatePath `
              -p $env:VSIX_SIGNING_PFX_PASSWORD `
              -cfp $env:VSIX_SIGNING_CERT_SHA256 `
              -fd SHA256 `
              -d "Codex Community Connector VSIX" `
              -u "https://github.com/rodrigojager/codex-visual-studio-extension" `
              -t "http://timestamp.acs.microsoft.com/" `
              CodexVsix\CodexVsix.vsix
            if ($LASTEXITCODE -ne 0) {
              throw "Sign CLI encerrou com código $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signed VSIX
        if: ${{ env.VSIX_SIGNING_PFX_BASE64 != '' && env.VSIX_SIGNING_PFX_PASSWORD != '' && env.VSIX_SIGNING_CERT_SHA256 != '' }}
        shell: pwsh
        run: |
          .\scripts\Test-VsixPackage.ps1 `
            -VsixPath CodexVsix\CodexVsix.vsix `
            -ExpectedVersion "${{ steps.version.outputs.version }}" `
            -RequireSignature

      - name: Collect artifact
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $target = Join-Path (Resolve-Path artifacts) ("Codex-Community-Connector-" + "${{ steps.version.outputs.version }}" + ".vsix")
          Copy-Item -LiteralPath CodexVsix\CodexVsix.vsix -Destination $target -Force
          "path=$($target -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare release notes from changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + ' - [^\r\n]+\r?\n(.*?)(?=^## |\z)'
          $section = [regex]::Match($changelog, $pattern)
          if (-not $section.Success) {
            throw "CHANGELOG.md does not contain release notes for $version."
          }
          $section.Groups[1].Value.Trim() | Set-Content -LiteralPath artifacts/ReleaseNotes.md -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Community-Connector-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.path }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Codex Community Connector v${{ steps.version.outputs.version }}
          files: ${{ steps.package.outputs.path }}
          body_path: artifacts/ReleaseNotes.md
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
